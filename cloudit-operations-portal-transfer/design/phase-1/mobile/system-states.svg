<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><defs><linearGradient id="accent"><stop stop-color="#ff3868"/><stop offset="1" stop-color="#7c4dff"/></linearGradient></defs><rect width="390" height="844" fill="#07101f"/><rect x="0" y="0" width="390" height="72" rx="0" fill="#091426" stroke="none"/><text x="20" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#f4f7fb" text-anchor="start">CLOUDIT</text><text x="20" y="49" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="700" fill="#91a1b9" text-anchor="start">OPERATIONS</text><rect x="272" y="23" width="86" height="26" rx="13" fill="#ffb84d20" stroke="#ffb84d66"/><circle cx="285" cy="36" r="4" fill="#ffb84d"/><text x="296" y="41" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffb84d" text-anchor="start">AMBER</text><text x="18" y="106" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#f4f7fb" text-anchor="start">System states</text><text x="18" y="128" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#91a1b9" text-anchor="start">Loading, empty, no-data, stale, partial, permission and error</text><rect x="18" y="154" width="354" height="50" rx="12" fill="#0d192b" stroke="#243551"/><rect x="30" y="166" width="88" height="26" rx="13" fill="#7c4dff20" stroke="#7c4dff66"/><circle cx="43" cy="179" r="4" fill="#7c4dff"/><text x="54" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#7c4dff" text-anchor="start">LOADING</text><text x="128" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#91a1b9" text-anchor="start">Skeleton content · retain page context</text><rect x="18" y="212" width="354" height="50" rx="12" fill="#0d192b" stroke="#243551"/><rect x="30" y="224" width="88" height="26" rx="13" fill="#86a5d820" stroke="#86a5d866"/><circle cx="43" cy="237" r="4" fill="#86a5d8"/><text x="54" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#86a5d8" text-anchor="start">EMPTY</text><text x="128" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#91a1b9" text-anchor="start">No configured records · show next safe action</text><rect x="18" y="270" width="354" height="50" rx="12" fill="#0d192b" stroke="#243551"/><rect x="30" y="282" width="88" height="26" rx="13" fill="#86a5d820" stroke="#86a5d866"/><circle cx="43" cy="295" r="4" fill="#86a5d8"/><text x="54" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#86a5d8" text-anchor="start">NO DATA</text><text x="128" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#91a1b9" text-anchor="start">Source unsupported or not yet collected</text><rect x="18" y="328" width="354" height="50" rx="12" fill="#0d192b" stroke="#243551"/><rect x="30" y="340" width="88" height="26" rx="13" fill="#ffb84d20" stroke="#ffb84d66"/><circle cx="43" cy="353" r="4" fill="#ffb84d"/><text x="54" y="358" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffb84d" text-anchor="start">STALE</text><text x="128" y="358" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#91a1b9" text-anchor="start">Keep last value · show observed time</text><rect x="18" y="386" width="354" height="50" rx="12" fill="#0d192b" stroke="#243551"/><rect x="30" y="398" width="88" height="26" rx="13" fill="#ffb84d20" stroke="#ffb84d66"/><circle cx="43" cy="411" r="4" fill="#ffb84d"/><text x="54" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffb84d" text-anchor="start">PARTIAL</text><text x="128" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#91a1b9" text-anchor="start">Some evidence missing · never claim healthy</text><rect x="18" y="444" width="354" height="50" rx="12" fill="#0d192b" stroke="#243551"/><rect x="30" y="456" width="88" height="26" rx="13" fill="#ff5d7320" stroke="#ff5d7366"/><circle cx="43" cy="469" r="4" fill="#ff5d73"/><text x="54" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ff5d73" text-anchor="start">PERMISSION</text><text x="128" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#91a1b9" text-anchor="start">Explain access boundary · reveal no metadata</text><rect x="18" y="502" width="354" height="50" rx="12" fill="#0d192b" stroke="#243551"/><rect x="30" y="514" width="88" height="26" rx="13" fill="#ff5d7320" stroke="#ff5d7366"/><circle cx="43" cy="527" r="4" fill="#ff5d73"/><text x="54" y="532" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ff5d73" text-anchor="start">ERROR</text><text x="128" y="532" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#91a1b9" text-anchor="start">Safe category + retry · never raw error</text><rect x="0" y="774" width="390" height="70" rx="0" fill="#091426" stroke="#243551"/><rect x="20" y="786" width="28" height="28" rx="8" fill="#122139" stroke="none"/><text x="34" y="805" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#91a1b9" text-anchor="middle">OV</text><text x="34" y="830" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="600" fill="#91a1b9" text-anchor="middle">Overview</text><rect x="114" y="786" width="28" height="28" rx="8" fill="#122139" stroke="none"/><text x="128" y="805" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#91a1b9" text-anchor="middle">CL</text><text x="128" y="830" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="600" fill="#91a1b9" text-anchor="middle">Clients</text><rect 