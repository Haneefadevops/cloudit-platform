services:
  notchme-web:
    build:
      context: ../..
      dockerfile: infra/notchme-web/Dockerfile
    image: cloudit/notchme-web:latest
    container_name: notchme-web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../../apps/notchme-web/.env
    environment:
      - NODE_ENV=production
      - PORT=3005
    networks:
      - cloudit
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notchme-web.rule=Host(`${NOTCHME_WEB_HOST:?NOTCHME_WEB_HOST must be set}`)"
      - "traefik.http.routers.notchme-web.entrypoints=websecure"
      - "traefik.http.routers.notchme-web.tls.certresolver=cloudflare"
      - "traefik.http.services.notchme-web.loadbalancer.server.port=3005"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3005 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  cloudit:
    external: true
