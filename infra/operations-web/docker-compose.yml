services:
  operations-web:
    build:
      context: ../..
      dockerfile: infra/operations-web/Dockerfile
    image: cloudit/operations-web:latest
    container_name: operations-web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../../apps/operations-web/.env
    environment:
      - NODE_ENV=production
      - PORT=3016
    networks:
      - cloudit
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.operations-web.rule=Host(`operations.${DOMAIN:-cloudit.lk}`)"
      - "traefik.http.routers.operations-web.entrypoints=websecure"
      - "traefik.http.routers.operations-web.tls.certresolver=cloudflare"
      - "traefik.http.services.operations-web.loadbalancer.server.port=3016"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3016/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 96M

networks:
  cloudit:
    external: true
