services:
  fixifai-web:
    build:
      context: ../../apps/fixifai-web
      dockerfile: Dockerfile
    image: cloudit/fixifai-web:latest
    container_name: fixifai-web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ../../apps/fixifai-web/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3013
    volumes:
      # pilot signup leads (signups.json) survive redeploys
      - fixifai-data:/app/data
    networks:
      - cloudit
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fixifai-web.rule=Host(`fixifai.${DOMAIN:-cloudit.lk}`)"
      - "traefik.http.routers.fixifai-web.entrypoints=websecure"
      - "traefik.http.routers.fixifai-web.tls.certresolver=cloudflare"
      - "traefik.http.routers.fixifai-web.tls.domains[0].main=${DOMAIN:-cloudit.lk}"
      - "traefik.http.routers.fixifai-web.tls.domains[0].sans=*.${DOMAIN:-cloudit.lk}"
      - "traefik.http.services.fixifai-web.loadbalancer.server.port=3013"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3013 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  fixifai-data:

networks:
  cloudit:
    external: true
